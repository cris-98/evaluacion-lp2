<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Nuevo Alquiler</title></head>
<body>
<h1>Registrar Alquiler</h1>
<form th:action="@{/alquileres/guardar}" th:object="${alquiler}" method="post">
  <p>
    Cliente:
    <select th:field="*{cliente}">
      <option th:each="c : ${clientes}" th:value="${c}" th:text="${c.nombre}"></option>
    </select>
  </p>
  <p>
    Película:
    <select name="idPelicula">
      <option th:each="p : ${peliculas}" th:value="${p.idPelicula}" th:text="${p.titulo}"></option>
    </select>
  </p>
  <p>
    Cantidad:
    <input type="number" name="cantidad" value="1" min="1"/>
  </p>
  <p>
    Estado:
    <select th:field="*{estado}">
      <option th:each="e : ${estados}" th:value="${e}" th:text="${e}"></option>
    </select>
  </p>
  <button type="submit">Guardar</button>
</form>
</body>
</html>
