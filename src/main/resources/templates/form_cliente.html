<!DOCTYPE html>
<html xmlns:space="http://www.thymeleaf.org">
<head>
    <title>Formulario Cliente</title>
</head>
<body>
<h1>Registrar Cliente</h1>
<form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post">
    <p>
        Nombre: <input type="text" th:field="*{nombre}"/>
    </p>
    <span th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
    <p>
        Email: <input type="text" th:field="*{email}"/>
        <span th:if="${#fields.hasErrors('email')}" th:errors
    </p>

</form>

</body>
</html>
